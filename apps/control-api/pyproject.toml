[project]
name = "ppswitch-control"
version = "0.1.0"
description = "pp switch control plane API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "ppswitch-db",
    "ppswitch-policy",
    "ppswitch-discovery",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_control"]

[project.scripts]
ppswitch-control-api = "ppswitch_control.main:main"
