[project]
name = "ppswitch-mcp"
version = "0.1.0"
description = "pp switch MCP adapter: exposes published capabilities as MCP tools"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "mcp>=1.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_mcp"]

[project.scripts]
ppswitch-mcp = "ppswitch_mcp.server:main"
