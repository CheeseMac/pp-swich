[project]
name = "ppswitch-mockcrm"
version = "0.1.0"
description = "Synthetic mock CRM used by the pp switch demo and tests (no real data)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_mockcrm"]

[project.scripts]
ppswitch-mock-crm = "ppswitch_mockcrm.main:main"
