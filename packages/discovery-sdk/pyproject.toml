[project]
name = "ppswich-discovery"
version = "0.1.0"
description = "pp swich discovery SDK: sanitized HAR/OpenAPI import, normalization, schema inference"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_discovery"]
