[project]
name = "ppswitch-policy"
version = "0.1.0"
description = "pp switch policy engine: deny-by-default authorization decisions"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_policy"]
