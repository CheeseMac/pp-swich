[project]
name = "ppswich-db"
version = "0.1.0"
description = "pp swich persistence: ORM models, Alembic migrations, session utilities"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_db", "alembic.ini", "migrations"]
