[project]
name = "ppswich-policy"
version = "0.1.0"
description = "pp swich policy engine: deny-by-default authorization decisions"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_policy"]
