[project]
name = "ppswich-core"
version = "0.1.0"
description = "pp swich core domain contracts (Pydantic models, enums, errors, state machine)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_core"]
