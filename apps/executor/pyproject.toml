[project]
name = "ppswitch-executor"
version = "0.1.0"
description = "pp switch trusted executor: the only process that touches credentials"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "ppswitch-secrets",
    "ppswitch-policy",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_executor"]

[project.scripts]
ppswitch-executor = "ppswitch_executor.main:main"
