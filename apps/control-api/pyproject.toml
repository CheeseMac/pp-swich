[project]
name = "ppswich-control"
version = "0.1.0"
description = "pp swich control plane API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
    "ppswich-db",
    "ppswich-policy",
    "ppswich-discovery",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_control"]

[project.scripts]
ppswich-control-api = "ppswich_control.main:main"
