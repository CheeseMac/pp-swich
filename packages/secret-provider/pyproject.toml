[project]
name = "ppswitch-secrets"
version = "0.1.0"
description = "pp switch SecretProvider abstraction with in-memory mock implementation"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25",
    "ppswitch-core",
]

[project.scripts]
ppswitch-secret = "ppswitch_secrets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_secrets"]
