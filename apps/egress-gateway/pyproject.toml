[project]
name = "ppswitch-egress"
version = "0.1.0"
description = "Controlled egress gateway: CONNECT-only forward proxy with its own target allowlist (pp-switch PR-QA-06 / DEP-14-F1)"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "ppswitch-executor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch_egress"]

[project.scripts]
ppswitch-egress-gateway = "ppswitch_egress.main:main"
