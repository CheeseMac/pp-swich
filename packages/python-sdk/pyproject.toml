[project]
name = "ppswitch"
version = "0.1.0"
description = "pp switch public Python SDK: secretless capability invocation"
requires-python = ">=3.12"
dependencies = [
    "ppswitch-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswitch"]
