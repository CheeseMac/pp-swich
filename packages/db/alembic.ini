[alembic]
script_location = migrations
prepend_sys_path = .
# The real URL is injected from PP_SWICH_DB_URL (or a caller-provided URL) in
# migrations/env.py; this placeholder is never used directly.
sqlalchemy.url = sqlite:///./data/pp-swich.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
