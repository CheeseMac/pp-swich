[project]
name = "ppswich-mcp"
version = "0.1.0"
description = "pp swich MCP adapter: exposes published capabilities as MCP tools"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
    "mcp>=1.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_mcp"]

[project.scripts]
ppswich-mcp = "ppswich_mcp.server:main"
