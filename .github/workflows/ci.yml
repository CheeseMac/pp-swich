name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint / typecheck / test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (packages + apps)
        run: uv run mypy packages apps
        continue-on-error: false

      - name: Pytest (unit + integration + e2e)
        run: uv run pytest

  frontend:
    name: web-console typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
