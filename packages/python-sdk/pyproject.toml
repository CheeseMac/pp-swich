[project]
name = "ppswich"
version = "0.1.0"
description = "pp swich public Python SDK: secretless capability invocation"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich"]
