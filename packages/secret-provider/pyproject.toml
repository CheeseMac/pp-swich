[project]
name = "ppswich-secrets"
version = "0.1.0"
description = "pp swich SecretProvider abstraction with in-memory mock implementation"
requires-python = ">=3.12"
dependencies = [
    "ppswich-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppswich_secrets"]
