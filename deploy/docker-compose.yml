# pp-switch 本地/单机部署（PR-DEP-14 第一版）
#
# 出口隔离模型（三层，见 docs/28-DEPLOYMENT-AND-EGRESS.md）：
#   1. 应用层：approved_hosts 白名单 + IP 钉扎 + v6 包装归一化（代码内）
#   2. 编排层：executor 只加入 internal 网络 —— 无外网路由，即使应用层
#      被绕过也无法出站；control 双宿（internal + 出口侧）
#   3. 主机层：出口防火墙白名单（文档提供 iptables/nftables 样例）
#
# 环境变量：所有 PP_SWITCH_* 密钥经 .env 注入（deploy/.env.example），
# 严禁写入镜像或 compose 文件。

name: pp-switch

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      ["uvicorn", "ppswitch_control.app:create_app_from_env", "--factory",
       "--host", "0.0.0.0", "--port", "8911"]
    environment: &control_env
      PP_SWITCH_DB_URL: sqlite:////data/pp-switch.db
      PP_SWITCH_EXECUTOR_URL: http://executor:8912
      PP_SWITCH_INTERNAL_TOKEN: ${PP_SWITCH_INTERNAL_TOKEN:?set in .env}
      PP_SWITCH_DELEGATION_SIGNING_KEY: ${PP_SWITCH_DELEGATION_SIGNING_KEY:?set in .env}
      PP_SWITCH_RESULT_ENCRYPTION_KEY: ${PP_SWITCH_RESULT_ENCRYPTION_KEY:?set in .env}
      PP_SWITCH_DEMO_MODE: ${PP_SWITCH_DEMO_MODE:-false}
      # 容器内不继承任何代理环境变量：出口只走应用层策略
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - control-data:/data
    networks: [internal, egress]
    ports: ["8911:8911"]   # 控制台/运维访问；生产建议置于反代之后
    restart: unless-stopped
    depends_on: [executor]

  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      ["uvicorn", "ppswitch_executor.main:create_app_from_env", "--factory",
       "--host", "0.0.0.0", "--port", "8912"]
    environment:
      PP_SWITCH_INTERNAL_TOKEN: ${PP_SWITCH_INTERNAL_TOKEN:?set in .env}
      PP_SWITCH_DEMO_MODE: ${PP_SWITCH_DEMO_MODE:-false}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - executor-data:/data
    networks: [internal]   # 关键：无 egress 网络 —— 容器级无出口路由
    restart: unless-stopped

  mock-crm:                # 演示用；生产部署删除本服务
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      ["uvicorn", "ppswitch_mockcrm.main:app", "--host", "0.0.0.0", "--port", "8913"]
    environment:
      PP_SWITCH_DEMO_MODE: "true"
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    internal: true         # 完全无出站路由的隔离网
  egress: {}               # 仅 control 加入；受主机出口防火墙约束

volumes:
  control-data:
  executor-data:
